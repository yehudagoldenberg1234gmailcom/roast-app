<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 שרוף אותי — AI Roast</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Heebo', sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .logo {
    font-size: 48px;
    margin-bottom: 8px;
  }

  h1 {
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff6b00, #ff0055);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  .subtitle {
    color: #888;
    font-size: 16px;
    margin-bottom: 40px;
    text-align: center;
  }

  .card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 20px;
    padding: 32px;
    width: 100%;
    max-width: 520px;
  }

  label {
    display: block;
    font-size: 14px;
    color: #aaa;
    margin-bottom: 8px;
    font-weight: 500;
  }

  textarea {
    width: 100%;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 12px;
    color: #fff;
    font-family: 'Heebo', sans-serif;
    font-size: 15px;
    padding: 14px 16px;
    resize: none;
    height: 100px;
    margin-bottom: 20px;
    direction: rtl;
    transition: border 0.2s;
  }

  textarea:focus {
    outline: none;
    border-color: #ff6b00;
  }

  textarea::placeholder { color: #444; }

  .intensity-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .intensity-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #333;
    background: transparent;
    color: #888;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .intensity-btn.active {
    border-color: #ff6b00;
    color: #ff6b00;
    background: rgba(255,107,0,0.1);
  }

  .roast-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #ff6b00, #ff0055);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Heebo', sans-serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .roast-btn:hover { opacity: 0.9; }
  .roast-btn:active { transform: scale(0.98); }
  .roast-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .result-card {
    margin-top: 24px;
    background: #0a0a0a;
    border: 1px solid #ff6b0033;
    border-radius: 16px;
    padding: 24px;
    display: none;
  }

  .result-card.show { display: block; }

  .result-header {
    font-size: 13px;
    color: #ff6b00;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }

  .result-text {
    font-size: 17px;
    line-height: 1.7;
    color: #eee;
    white-space: pre-wrap;
  }

  .share-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .share-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #333;
    background: transparent;
    color: #aaa;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .share-btn:hover {
    border-color: #ff6b00;
    color: #ff6b00;
  }

  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #888;
    font-size: 15px;
    padding: 16px 0;
  }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid #333;
    border-top-color: #ff6b00;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .counter {
    text-align: center;
    color: #444;
    font-size: 13px;
    margin-top: 32px;
  }

  .counter span { color: #ff6b00; }
</style>
</head>
<body>

<div class="logo">🔥</div>
<h1>שרוף אותי</h1>
<p class="subtitle">ספר לי על עצמך — ה-AI ישרוף אותך 😈</p>

<div class="card">
  <label>ספר על עצמך (גיל, תחביבים, אופי...)</label>
  <textarea id="userInput" placeholder="לדוגמה: אני בן 17, מבלה 8 שעות ביום על פורטנייט, אמא שלי עוד מכינה לי ארוחות..."></textarea>

  <label>עוצמת השריפה 🌶️</label>
  <div class="intensity-row">
    <button class="intensity-btn" onclick="setIntensity('קלה')">😊 קל</button>
    <button class="intensity-btn active" onclick="setIntensity('בינונית')">😏 בינוני</button>
    <button class="intensity-btn" onclick="setIntensity('חריפה')">🔥 חריף</button>
    <button class="intensity-btn" onclick="setIntensity('הרס מוחלט')">💀 הרס</button>
  </div>

  <button class="roast-btn" onclick="getRoast()" id="roastBtn">
    🔥 שרוף אותי!
  </button>

  <div class="result-card" id="resultCard">
    <div class="result-header">🤖 ה-AI שרף אותך:</div>
    <div class="result-text" id="resultText"></div>
    <div class="share-row">
      <button class="share-btn" onclick="copyRoast()">📋 העתק</button>
      <button class="share-btn" onclick="shareWhatsapp()">💬 שתף בוואטסאפ</button>
      <button class="share-btn" onclick="getRoast()">🔄 עוד אחד</button>
    </div>
  </div>
</div>

<div class="counter">כבר נשרפו <span id="count">0</span> אנשים היום 😂</div>

<script>
let intensity = 'בינונית';
let roastCount = parseInt(localStorage.getItem('roastCount') || '0');
document.getElementById('count').textContent = roastCount;

function setIntensity(val) {
  intensity = val;
  document.querySelectorAll('.intensity-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

async function getRoast() {
  const input = document.getElementById('userInput').value.trim();
  if (!input) {
    alert('ספר קצת על עצמך קודם 😄');
    return;
  }

  const btn = document.getElementById('roastBtn');
  const resultCard = document.getElementById('resultCard');
  const resultText = document.getElementById('resultText');

  btn.disabled = true;
  btn.textContent = '🔥 שורף...';
  resultCard.className = 'result-card show';
  resultText.innerHTML = '<div class="loading"><div class="spinner"></div> ה-AI מכין לך שריפה מיוחדת...</div>';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `אתה קומיקאי ישראלי מצחיק שעושה "roast" — ביקורת הומוריסטית חדה על אנשים, בסגנון סטנדאפ ישראלי. 
          
המשתמש סיפר על עצמו: "${input}"

עוצמת השריפה: ${intensity}

כתוב roast מצחיק בעברית — 3-4 משפטים קצרים וחדים. 
- בעוצמה קלה: הומור עדין וחברותי
- בינונית: ישיר ומצחיק  
- חריפה: חד וקצת גס
- הרס מוחלט: אכזרי ומצחיק (אבל לא פוגעני באמת)

תכתוב רק את ה-roast עצמו, בלי הקדמות.`
        }]
      })
    });

    const data = await response.json();
    const roast = data.content[0].text;
    resultText.textContent = roast;

    roastCount++;
    localStorage.setItem('roastCount', roastCount);
    document.getElementById('count').textContent = roastCount;

  } catch (err) {
    resultText.textContent = 'משהו השתבש... אבל לפחות אתה יותר שבור מהאפליקציה 😂';
  }

  btn.disabled = false;
  btn.textContent = '🔥 שרוף אותי!';
}

function copyRoast() {
  const text = document.getElementById('resultText').textContent;
  navigator.clipboard.writeText(text);
  alert('הועתק! 📋');
}

function shareWhatsapp() {
  const text = document.getElementById('resultText').textContent;
  const url = `https://wa.me/?text=${encodeURIComponent('ה-AI שרף אותי 🔥\n\n' + text + '\n\nשרוף גם אותך: ' + window.location.href)}`;
  window.open(url);
}
</script>
</body>
</html>
